<div class="like-container" data-id="{{ load.id }}" data-model="{{ model_name }}">
    <button class="like-button" style="background:none; border:none;">
      {% comment %} <i class="fa{% if load.likes. %}s{% else %}r{% endif %} fa-heart"></i> {% endcomment %}
      <span class="like-count">{{ load.likes.count }}</span>
    </button>
  </div>
