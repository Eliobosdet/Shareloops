<div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Informations about the image</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body text-center">
            <p>The image have to be in JPG or PNG format and must not exceed 2MB in size.</p>
            <p>The file name must not exceed 50 characters.</p>
          <img id="imagePreview" class="img-thumbnail" width="150" height="150" alt="Anteprima">
        </div>
        <div class="modal-footer">
          {% comment %} <button id="confirmUploadBtn" class="btn btn-primary">Carica</button> {% endcomment %}
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Ok</button>
        </div>
      </div>
    </div>
  </div>
