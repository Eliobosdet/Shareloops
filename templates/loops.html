{% extends "base.html" %}

{% block title %}Loops{% endblock %}
{% block content %}
<div class="container mt-5">
  <h1>Loops</h1>
  <ul>
    {% for loop in loops %}
    <li>
      <img src="{{ loop.cover_image }}" alt="(Loop Image)" width="100" height="100" />
      <h4>{{ loop.title }}</h2>
      <p>{{ loop.description }}</p>
        <p>Uploaded by: {{ loop.user.username }}</p>
      <audio controls>
          <source src="{{ loop.audio.url }}" type="audio/mpeg">
      </audio>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
