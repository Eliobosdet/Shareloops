{% extends "base.html" %}

{% block title %}
    Sing Up
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm mt-3">
                <div class="card-body p-3 p-md-5">
                    <h2 class="text-center mb-4">Sign up</h2>
                    
                    <!-- Form -->
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label">Name*</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="country" class="form-label">Surname*</label>
                                <input type="text" class="form-control" id="surname" name="surname" required>
                                </select>
                            </div>
                        
                        <div class="row">
                            <div class="col-md-12 mb-3">
                            <label for="email" class="form-label">Email*</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label">Username*</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="country" class="form-label">Password*</label>
                                <input type="text" class="form-control" id="passoword" name="passoword" required>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="country" class="form-label">Repeat Password*</label>
                                <input type="text" class="form-control" id="rptpassword" name="rptpassword" required>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="country" class="form-label">Country/Region*</label>
                                <select class="form-select" id="country" name="country">
                                    <option value="IT">Italy</option>
                                    <!-- Altri paesi -->
                                </select>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mt-3">Continue</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
